# Default values for hoslog.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
environment: development

replicaCount: 1

image:
  pullSecret: gitlab-regcred

imagePullSecrets: ["gitlab-regcred"]
nameOverride: "customer-api"
fullnameOverride: "customer-api"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  certificate_arn: arn:aws:acm:ap-northeast-1:503110774696:certificate/f56f1c34-d5db-4361-90d8-d848fa7765ad
  hosts:
    - host: dev-customer-api.hoslog.jp
      paths:
        - path: /*
          pathType: ImplementationSpecific

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 150m
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 128Mi

# livenessProbe:
#   httpGet:
#     path: /health
#     port: http
# readinessProbe:
#   httpGet:
#     path: /health
#     port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

secretsToFile:
  enabled: true
  secretNames:
    - appsettings.json

podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1
